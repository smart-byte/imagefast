<!doctype html>
<!-- Source of public/og.png, the link preview image. Not part of the built site: open it at 1200×630 and take a screenshot at 2× to regenerate. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>imagefast link preview</title>
    <link rel="stylesheet" href="../node_modules/@fontsource-variable/schibsted-grotesk/index.css" />
    <link rel="stylesheet" href="../node_modules/@fontsource-variable/jetbrains-mono/index.css" />
    <style>
      :root {
        --bg: #f8f9f5;
        --surface: #fff;
        --tint: #eff3e9;
        --ink: #1f2623;
        --text: #414b44;
        --muted: #647064;
        --line: #e1e6d9;
        --dot: #cbd4bf;
        --bar: #b4c0a8;
        --accent: #e86635;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        display: grid;
        grid-template-columns: 1fr 412px;
        gap: 56px;
        align-items: center;
        padding: 64px 72px;
        background:
          radial-gradient(var(--dot) 1.2px, transparent 1.2px) 0 0 / 28px 28px,
          var(--bg);
        color: var(--text);
        font:
          24px/1.45 'Schibsted Grotesk Variable',
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .copy {
        display: grid;
        gap: 30px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--ink);
        font-size: 38px;
        font-weight: 700;
        letter-spacing: -0.06em;
        line-height: 1;
      }
      .brand svg {
        width: 40px;
        height: 40px;
        fill: none;
        stroke: var(--accent);
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .brand b,
      h1 span {
        color: var(--accent);
      }
      h1 {
        color: var(--ink);
        font-size: 104px;
        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.055em;
      }
      h1 span {
        position: relative;
        display: inline-block;
      }
      h1 svg {
        position: absolute;
        left: 0;
        bottom: -0.1em;
        width: 97%;
        height: 0.16em;
        fill: none;
        stroke: var(--accent);
        stroke-width: 3;
        stroke-linecap: round;
      }
      .facts {
        font:
          500 19px/1 'JetBrains Mono Variable',
          monospace;
        color: var(--muted);
      }
      figure {
        display: grid;
        gap: 22px;
        padding: 30px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--surface);
        box-shadow:
          0 1px 2px #2b3a240a,
          0 28px 56px -30px #2b3a2459;
      }
      figcaption {
        color: var(--muted);
        font-size: 19px;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px 16px;
        align-items: baseline;
        color: var(--ink);
        font-size: 21px;
      }
      .row b {
        font:
          500 20px 'JetBrains Mono Variable',
          monospace;
      }
      .row i {
        grid-column: 1 / -1;
        height: 12px;
        border-radius: 6px;
        background: linear-gradient(to right, var(--bar) var(--value), var(--tint) 0);
      }
      .row.ours i {
        background: linear-gradient(to right, var(--accent) var(--value), var(--tint) 0);
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="brand">
        <svg viewBox="0 0 28 28">
          <rect x="4" y="4" width="20" height="20" rx="3.5" />
          <path d="m4 19 6-7 4 4 4-6 6 9" />
          <circle cx="9" cy="9" r="1.4" fill="currentColor" stroke="none" style="color: var(--accent)" /></svg
        ><span>imagefast<b>.</b></span>
      </div>
      <h1>
        Big images.<br /><span
          >Light work<svg viewBox="0 0 400 16" preserveAspectRatio="none"><path d="M3 12C95 1 263 1 396 9" /></svg></span
        >.
      </h1>
      <p>Dimensions, thumbnails and RAW previews in the browser, on a worker pool.</p>
      <p class="facts">11 kB gzipped · zero dependencies</p>
    </div>
    <figure>
      <figcaption>40 photos, 12 MP each, to thumbnails</figcaption>
      <div class="row ours"><span>imagefast</span><b>303 ms</b><i style="--value: 10.4%"></i></div>
      <div class="row"><span>&lt;img&gt; and canvas</span><b>2,637 ms</b><i style="--value: 90.2%"></i></div>
      <div class="row"><span>pica</span><b>2,923 ms</b><i style="--value: 100%"></i></div>
    </figure>
  </body>
</html>
